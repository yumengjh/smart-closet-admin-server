# 鱼搭管理接口契约快照，请勿手改。契约源：yumengjh/smart-closet-server docs/management-api.yaml
# source-commit: 06e2ff4a9749b34eed7c2bfbf395c62d85e5bd22
# source-sha256: 1ce8c512d193c48f668ad53443ad53a9d3a8788afdc7b5830a75ce115c744df8
# 更新方式：scripts/sync-closet-contract.sh [鱼搭仓库路径]
openapi: 3.1.0
info:
  title: Smart Closet Management API
  version: 1.5.0
  description: |
    鱼搭中立管理接口。默认关闭（`closet.management.enabled=false`），开启后供任意宿主平台以服务身份调用。
    设计说明见 `docs/design/2026-10-07-管理平台接入与可插拔管理接口设计.md`；1.1（运维、KPI、大屏与数据出口、模板审核）见
    `docs/design/2026-10-09-管理接口二期：运维、KPI与大屏数据设计.md`；1.2（注册、邀请码、账号事件与资料字段）见
    `docs/design/2026-10-19-用户账号：注册、资料与管理设计.md`；1.3（收费：开关、档位与价格、成本、利润、兑换码、权益与点数）见
    `docs/design/2026-11-10-收费与权益设计.md`。

    认证：每个请求都必须携带 HMAC 签名头（见 `components.securitySchemes.closetHmac`）。
    时间字段均为 Unix 毫秒，字段名以 `AtMs` 结尾；日期参数为 `YYYY-MM-DD`，按 Asia/Shanghai 解释，`to` 含当天。
    错误统一为 RFC 9457 Problem Details（`application/problem+json`）。

    数据口径：鱼搭不记录实际穿着。“使用”指衣物出现在已保存搭配中的次数；衣物分类映射版本为 `closet-families-v1`。
servers:
  - url: /api/manage/v1
security:
  - closetHmac: []
tags:
  - name: creations
  - name: users
  - name: registration
    description: 注册模式（只读，来自部署配置）与邀请码
  - name: insights
  - name: ops
    description: 运维状态、后台任务、管理操作日志（只读）
  - name: dashboard
    description: 大屏快照（只含汇总，不含用户名）
  - name: exports
    description: 数仓出口：按天宽表与去标识明细事件
  - name: templates
    description: 搭配模板审核
  - name: billing
    description: 收费：运行时开关、档位与点数价格、上游成本、利润报表、兑换码批次、用户权益与点数。用户只以 userKey 出现；不提供退款、重试或支付密钥接口
  - name: style-terms
    description: 助手学到的风格词审核（不含用户名，只给提出人数）
paths:
  /creations/usage:
    get:
      operationId: getCreationUsage
      tags: [creations]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Bounded aggregates by template, actual model and currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationUsageReport' }
        '400': { $ref: '#/components/responses/Problem' }
  /creations/templates:
    get:
      operationId: listCreationTemplates
      tags: [creations]
      responses:
        '200':
          description: Creation templates and versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CreationTemplateSummary' } }
  /creations/templates/{id}/versions:
    parameters: [ { $ref: '#/components/parameters/CreationTemplateId' } ]
    post:
      operationId: createCreationTemplateVersion
      tags: [creations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationVersionCreate' }
      responses:
        '200':
          description: Draft version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /creations/templates/{id}/versions/{versionId}:
    parameters: [ { $ref: '#/components/parameters/CreationTemplateId' }, { $ref: '#/components/parameters/CreationVersionId' } ]
    get:
      operationId: getCreationTemplateVersion
      tags: [creations]
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationVersion' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateCreationTemplateVersion
      tags: [creations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationVersionEdit' }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /creations/templates/{id}/versions/{versionId}/verify:
    parameters: [ { $ref: '#/components/parameters/CreationTemplateId' }, { $ref: '#/components/parameters/CreationVersionId' } ]
    post:
      operationId: verifyCreationTemplateVersion
      tags: [creations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationVersionVerify' }
      responses:
        '200':
          description: Verified version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /creations/templates/{id}/versions/{versionId}/publish:
    parameters: [ { $ref: '#/components/parameters/CreationTemplateId' }, { $ref: '#/components/parameters/CreationVersionId' } ]
    post:
      operationId: publishCreationTemplateVersion
      tags: [creations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationRevision' }
      responses:
        '200':
          description: Published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /creations/templates/{id}/retire:
    parameters: [ { $ref: '#/components/parameters/CreationTemplateId' } ]
    post:
      operationId: retireCreationTemplate
      tags: [creations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationRevision' }
      responses:
        '200':
          description: Template retired
          content:
            application/json:
              schema:
                type: object
                required: [retired]
                properties:
                  retired: { type: boolean }
        '409': { $ref: '#/components/responses/Problem' }
  /creations/capabilities:
    get:
      operationId: listCreationCapabilities
      tags: [creations]
      responses:
        '200':
          description: ART_CREATION capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CreationCapability' } }
    put:
      operationId: updateCreationCapability
      tags: [creations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationCapabilityChange' }
      responses:
        '200':
          description: Updated capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationCapability' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users:
    get:
      tags: [users]
      operationId: listUsers
      parameters:
        - { name: q, in: query, description: '用户名或昵称包含（忽略大小写）', schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { type: string, enum: [ENABLED, DISABLED] } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: registeredVia, in: query, schema: { type: string, enum: [ADMIN, INVITE, OPEN] } }
        - { name: deactivated, in: query, description: 'true 只看自助注销的账号，false 排除', schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, username, lastActiveAt, lastLoginAt], default: createdAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: 已创建；新用户首次登录必须修改密码
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{username}:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: getUser
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/status:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    patch:
      tags: [users]
      operationId: updateUserStatus
      description: 禁用时同一事务内吊销便携登录链接并删除全部会话。不可禁用最后一个启用的 ADMIN。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [username, enabled, revokedSessions]
                properties:
                  username: { type: string }
                  enabled: { type: boolean }
                  revokedSessions: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{username}/role:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    patch:
      tags: [users]
      operationId: updateUserRole
      description: 角色变化后删除该用户全部会话。不可降级最后一个启用的 ADMIN。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [username, role, revokedSessions]
                properties:
                  username: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  revokedSessions: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{username}/password-reset:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    post:
      tags: [users]
      operationId: resetUserPassword
      description: 设置新密码（为空则生成临时密码，仅本次返回），要求下次登录修改，吊销便携链接并删除会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: { $ref: '#/components/schemas/OptionalPassword' }
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CredentialResult'
                  - type: object
                    required: [revokedSessions]
                    properties:
                      revokedSessions: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/sessions:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: listUserSessions
      responses:
        '200':
          description: 未过期会话（不暴露会话 ID）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [users]
      operationId: revokeUserSessions
      responses:
        '200':
          description: 已删除全部会话
          content:
            application/json:
              schema:
                type: object
                required: [revokedSessions]
                properties:
                  revokedSessions: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/profile:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    patch:
      tags: [users]
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, maxLength: 40, description: '空串清除昵称' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username: { type: string }
                  displayName: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/sessions/{sessionRef}:
    parameters:
      - $ref: '#/components/parameters/Username'
      - { name: sessionRef, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{16}$' } }
    delete:
      tags: [users]
      operationId: revokeUserSession
      description: 退出单个会话，`sessionRef` 取自 GET /users/{username}/sessions。
      responses:
        '204': { description: '已退出' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/login-lock:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: getUserLoginLock
      description: 该用户名当前 15 分钟窗口内的登录失败与锁定情况（按来源地址的限制不属于单个用户，不在此显示）。
      responses:
        '200':
          description: 登录锁定状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginLock' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [users]
      operationId: clearUserLoginLock
      description: 解除锁定（清空该用户名的失败计数），返回解除后的状态。
      responses:
        '200':
          description: 已解除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginLock' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/events:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: listUserEvents
      description: 最近 50 条账号事件（注册、登录成功、改密码、改资料、退出设备、注销，以及鱼搭管理员与管理接口的操作），新的在前；保留 180 天。
      responses:
        '200':
          description: 账号事件
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountEvent' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/portable-links:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: listUserPortableLinks
      responses:
        '200':
          description: 便携登录链接
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortableLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/portable-links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/Username'
      - { name: linkId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    delete:
      tags: [users]
      operationId: revokeUserPortableLink
      responses:
        '204': { description: '已吊销' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/quota:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: getUserQuota
      responses:
        '200':
          description: 今日额度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [users]
      operationId: updateUserQuota
      description: '`null` 表示恢复默认限额。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [imageDailyLimit, agentDailyLimit]
              properties:
                imageDailyLimit: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
                agentDailyLimit: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/token-budget:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: getUserTokenBudget
      description: 助手 token 日预算与当日用量（输入加输出 token，北京时间自然日）。限额超出后，用户发起的助手消息返回 429 `AGENT_TOKEN_BUDGET_EXCEEDED`。
      responses:
        '200':
          description: 今日 token 预算
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenBudget' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [users]
      operationId: updateUserTokenBudget
      description: '`dailyTokenLimit` 为 `null` 表示恢复默认限额（`CLOSET_AGENT_USER_TOKEN_DAILY_LIMIT`，默认 3000000；默认值为 0 表示不设上限）。覆盖值立即生效。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dailyTokenLimit]
              properties:
                dailyTokenLimit: { type: [integer, 'null'], format: int64, minimum: 1, maximum: 1000000000 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenBudget' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registration:
    get:
      tags: [registration]
      operationId: getRegistration
      description: 生效模式 = 管理覆盖值（若有）否则部署配置 `CLOSET_REGISTRATION`。
      responses:
        '200':
          description: 注册模式
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationState' }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      tags: [registration]
      operationId: setRegistration
      description: 覆盖注册模式，立即生效；`mode` 为 null 或缺省则删除覆盖，回到部署配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode: { type: [string, 'null'], enum: [CLOSED, INVITE, OPEN, null] }
      responses:
        '200':
          description: 修改后的状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationState' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /invites:
    get:
      tags: [registration]
      operationId: listInvites
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, USED_UP, EXPIRED, REVOKED] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 邀请码分页，新的在前（不含明文）
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invite' } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [registration]
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: [string, 'null'], maxLength: 100 }
                maxUses: { type: [integer, 'null'], minimum: 1, maximum: 100, default: 1 }
                expiresInDays: { type: [integer, 'null'], minimum: 1, maximum: 90, default: 7 }
      responses:
        '201':
          description: 已创建；`code` 只在本响应出现一次，调用方不得记录到日志
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invite'
                  - type: object
                    required: [code]
                    properties:
                      code: { type: string, example: 'K7QM-2XPA-9WDE' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /invites/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 36 } }
    get:
      tags: [registration]
      operationId: getInvite
      responses:
        '200':
          description: 邀请码及用它注册的账号
          content:
            application/json:
              schema:
                type: object
                required: [invite, registeredUsers]
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  registeredUsers:
                    type: array
                    items:
                      type: object
                      required: [username, createdAtMs, enabled]
                      properties:
                        username: { type: string }
                        createdAtMs: { type: integer, format: int64 }
                        enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [registration]
      operationId: updateInvite
      description: 至少一个字段；`note` 空串清除；`maxUses` 不能低于已用次数；`expiresAtMs` 需在现在之后 90 天以内。已撤销的邀请码不能修改（409 INVITE_REVOKED）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: [string, 'null'], maxLength: 100 }
                maxUses: { type: [integer, 'null'], minimum: 1, maximum: 100 }
                expiresAtMs: { type: [integer, 'null'], format: int64 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [registration]
      operationId: revokeInvite
      responses:
        '204': { description: '已撤销（重复撤销仍为 204）' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /account-events:
    get:
      tags: [users]
      operationId: listAccountEvents
      description: 全站账号事件（注册、登录成功与失败、锁定、越权拒绝、邀请码、改密码、改资料、退出设备、注销、鱼搭管理员与管理接口操作），新的在前，保留期由 closet.audit.retention-days 配置（默认 180 天）。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: username, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' } }
        - { name: action, in: query, schema: { type: string, pattern: '^[A-Z_]{1,48}$' } }
        - { name: actor, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 账号事件分页
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/AccountEvent'
                        - type: object
                          required: [id, username]
                          properties:
                            id: { type: string }
                            username: { type: string }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /security-audit:
    get:
      tags: [users]
      operationId: listSecurityAudit
      description: >-
        统一安全审计时间线，新的在前：合并账号事件（含登录失败、锁定、越权拒绝、邀请码、助手危险操作）、管理接口操作日志与模型调用明细
        （model_usage 与 generation_attempt：谁、何时、哪个模型、什么用途、成功 / 失败 / UNKNOWN，不含提示词与内容）。
        只读运维出口；明细含用户名，接入方不得转入大屏或数仓。登录失败的 subject 是登录名的单向键（~ 加 16 位十六进制，服务端密钥 HMAC），按 username 筛选时同时匹配该键（含旧版无密钥键）。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: username, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' } }
        - { name: category, in: query, schema: { type: string, enum: [AUTH, ACCESS, ACCOUNT, INVITE, ASSISTANT, MANAGEMENT, MODEL] } }
        - { name: type, in: query, description: '事件类型原文，如 LOGIN_FAILED、MODEL_CALL、MODEL_ATTEMPT 或管理操作名', schema: { type: string, pattern: '^[A-Za-z0-9_]{1,64}$' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 安全审计事件分页
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SecurityAuditItem' }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /security-audit/integrity:
    get:
      tags: [users]
      operationId: checkSecurityAuditIntegrity
      description: >-
        防篡改校验：先封存尚未封存的已结束日（按北京时间），再重算每日摘要链（account_event 与 management_operation_log 的当日记录的 SHA-256，
        并链接前一日摘要），保留期内的日子同时重算记录本身。status 为 INTACT（完整）、TAMPERED（problems 指出被改动的日期与类型）或 EMPTY（尚无已封存的日子）。
        摘要永久保留，超过保留期的日子只校验摘要链（expiredDays）。
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityAuditIntegrity' }
        '401': { $ref: '#/components/responses/Problem' }
