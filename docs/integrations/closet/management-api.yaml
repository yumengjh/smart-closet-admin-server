        expiresAtMs: { type: integer, format: int64 }
        revokedAtMs: { type: [integer, 'null'], format: int64 }
        status: { type: string, enum: [ACTIVE, USED_UP, EXPIRED, REVOKED] }
    PortableLink:
      type: object
      required: [id, createdAtMs, expiresAtMs, status]
