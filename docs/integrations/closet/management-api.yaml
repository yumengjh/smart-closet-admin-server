    Role:
      type: string
      enum: [USER, ADMIN]
    OptionalPassword:
      type: [string, 'null']
      description: 至少 12 个字符，且 UTF-8 编码后不超过 72 字节（BCrypt 上限；汉字通常 3 字节、表情符号 4 字节），超出返回 400 VALIDATION_FAILED，不截断。
      minLength: 12
      maxLength: 72
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: 'urn:closet:problem:user-not-found' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, MALFORMED_JSON, MANAGEMENT_SIGNATURE_MISSING, MANAGEMENT_KEY_UNKNOWN,
                 MANAGEMENT_TIMESTAMP_SKEWED, MANAGEMENT_SIGNATURE_INVALID, MANAGEMENT_REPLAYED, USER_NOT_FOUND,
                 PORTABLE_LINK_NOT_FOUND, SESSION_NOT_FOUND, INVITE_NOT_FOUND, INVITE_REVOKED, USER_ALREADY_EXISTS, LAST_ADMIN_PROTECTED, PAYLOAD_TOO_LARGE,
                 MANAGEMENT_BUSY, INTERNAL_ERROR]
        requestId: { type: string }
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
