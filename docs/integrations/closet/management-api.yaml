        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /presets/{id}:
    patch:
      tags: ["presets"]
      operationId: patchPreset
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PresetEdit"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PresetManagementItem"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
    delete:
      tags: ["presets"]
      operationId: removePreset
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      responses:
        '204': {"description": "No Content"}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /presets/batch:
    post:
      tags: ["presets"]
      operationId: batchPresets
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PresetBatch"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"updated": {"type": "integer"}}, "required": ["updated"]}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /presets/coverage:
    get:
      tags: ["presets"]
      operationId: getPresetCoverage
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/PresetCoverageCell"}}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /presets/source-sessions:
    post:
      tags: ["presets"]
      operationId: openPresetSourceSession
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PresetSourceCredentials"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PresetSourceSession"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '429': {"$ref": "#/components/responses/Problem"}
  /presets/source-sessions/{sessionId}:
    delete:
      tags: ["presets"]
      operationId: closePresetSourceSession
      parameters:
        - {"name": "sessionId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9_-]{43}$"}}
      responses:
        '204': {"description": "No Content"}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /presets/source-sessions/{sessionId}/garments:
    get:
      tags: ["presets"]
      operationId: listPresetSourceGarments
      parameters:
        - {"name": "sessionId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9_-]{43}$"}}
        - {"name": "q", "in": "query", "schema": {"type": "string"}}
        - {"name": "group", "in": "query", "schema": {"$ref": "#/components/schemas/PresetGroup"}}
        - {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}}
        - {"name": "size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 48}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PresetSourcePage"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /presets/source-sessions/{sessionId}/garments/{garmentId}/image:
    get:
      tags: ["presets"]
      operationId: getPresetSourceImage
      parameters:
        - {"name": "garmentId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
        - {"name": "sessionId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9_-]{43}$"}}
      responses:
        '200': {"description": "Success", "content": {"image/png": {"schema": {"type": "string", "format": "binary"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /presets/source-sessions/{sessionId}/import:
    post:
      tags: ["presets"]
      operationId: importPresetSourceGarments
      parameters:
        - {"name": "sessionId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9_-]{43}$"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PresetSourceImport"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/PresetManagementItem"}}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /onboarding/style-covers:
    get:
      tags: ["onboarding"]
      operationId: listOnboardingStyleCovers
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/OnboardingStyleCover"}}}, "required": ["items"]}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /onboarding/style-covers/{key}/image:
    put:
      tags: ["onboarding"]
      operationId: uploadOnboardingStyleCover
      parameters:
        - {"name": "key", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/OnboardingStyleKey"}}
      requestBody: {"required": true, "content": {"image/png": {"schema": {"type": "string", "format": "binary"}}, "image/jpeg": {"schema": {"type": "string", "format": "binary"}}, "image/webp": {"schema": {"type": "string", "format": "binary"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OnboardingStyleCover"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
        '413': {"$ref": "#/components/responses/Problem"}
    delete:
      tags: ["onboarding"]
      operationId: removeOnboardingStyleCover
      parameters:
        - {"name": "key", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/OnboardingStyleKey"}}
      responses:
        '204': {"description": "No Content"}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
    get:
      tags: ["onboarding"]
      operationId: getOnboardingStyleCoverImage
      parameters:
        - {"name": "key", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/OnboardingStyleKey"}}
      responses:
        '200': {"description": "Success", "content": {"image/jpeg": {"schema": {"type": "string", "format": "binary"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}

  /looks/categories:
    get:
      tags: ["looks"]
      operationId: listLookCategories
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/LookCategory"}}}, "required": ["items"]}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
    post:
      tags: ["looks"]
      operationId: createLookCategory
      description: New categories start disabled. A key that already exists answers 409.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookCategoryCreate"}}}}
      responses:
        '201': {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookCategory"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
  /looks/categories/{key}:
    patch:
      tags: ["looks"]
      operationId: patchLookCategory
      parameters:
        - {"name": "key", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/LookCategoryKey"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookCategoryEdit"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookCategory"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
    delete:
      tags: ["looks"]
      operationId: removeLookCategory
      description: Only a category without looks (other than removed ones) can be deleted; otherwise 409 LOOK_CATEGORY_NOT_EMPTY.
      parameters:
        - {"name": "key", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/LookCategoryKey"}}
      responses:
        '204': {"description": "No Content"}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
  /looks:
    get:
      tags: ["looks"]
      operationId: listLooks
      parameters:
        - {"name": "status", "in": "query", "description": "Absent: DRAFT, LISTED and UNLISTED", "schema": {"$ref": "#/components/schemas/LookStatus"}}
        - {"name": "category", "in": "query", "schema": {"$ref": "#/components/schemas/LookCategoryKey"}}
        - {"name": "verified", "in": "query", "schema": {"type": "boolean"}}
        - {"name": "q", "in": "query", "description": "Name contains", "schema": {"type": "string"}}
        - {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}}
        - {"name": "size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 48}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedLookPage"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
    post:
      tags: ["looks"]
      operationId: createLook
      description: A DRAFT without a picture; upload it with PUT /looks/{id}/image.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookCreate"}}}}
      responses:
        '201': {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedLook"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /looks/compose:
    post:
      tags: ["looks"]
      operationId: composeLook
      description: 2-6 LISTED preset garments laid out with the try-on reference grid. Zero model calls. Creates a DRAFT with source COMPOSE.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookCompose"}}}}
      responses:
        '201': {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedLook"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /looks/batch:
    post:
      tags: ["looks"]
      operationId: batchLooks
      description: One transaction. LIST fails the whole batch with 400 when a look has no picture.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookBatch"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"updated": {"type": "integer"}}, "required": ["updated"]}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /looks/{id}:
    patch:
      tags: ["looks"]
      operationId: patchLook
      description: A look without a picture cannot be LISTED (400).
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookEdit"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedLook"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
    delete:
      tags: ["looks"]
      operationId: removeLook
      description: Becomes a REMOVED tombstone; deleting again also answers 204. The stored picture is deleted after the commit.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      responses:
        '204': {"description": "No Content"}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /looks/{id}/image:
    put:
      tags: ["looks"]
      operationId: uploadLookImage
      description: Raw PNG, JPEG or WebP bytes, at most 20 MiB and 64 megapixels (this route alone has a 20 MiB HMAC body limit). Re-encoded without metadata, longest side 1024; transparent pictures stay PNG, others become JPEG. Each replacement increments imageVersion and clears verified.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      requestBody: {"required": true, "content": {"image/png": {"schema": {"type": "string", "format": "binary"}}, "image/jpeg": {"schema": {"type": "string", "format": "binary"}}, "image/webp": {"schema": {"type": "string", "format": "binary"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedLook"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
        '413': {"$ref": "#/components/responses/Problem"}
    get:
      tags: ["looks"]
      operationId: getLookImage
      description: The stored 1024 picture, Cache-Control no-store. REMOVED or no picture answers 404.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      responses:
        '200': {"description": "Success", "content": {"image/jpeg": {"schema": {"type": "string", "format": "binary"}}, "image/png": {"schema": {"type": "string", "format": "binary"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /poses:
    get:
      tags: ["poses"]
      operationId: listPoses
      description: Not paged; at most 200 items, total counts every match.
      parameters:
        - {"name": "status", "in": "query", "description": "Absent: DRAFT, LISTED and UNLISTED", "schema": {"$ref": "#/components/schemas/PoseStatus"}}
        - {"name": "q", "in": "query", "description": "Name or description contains", "schema": {"type": "string"}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedPosePage"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
    post:
      tags: ["poses"]
      operationId: createPose
      description: Checked with the management-side switches first; a refusal answers 422 POSE_REJECTED with hits. Without id the server makes p- plus 8 lowercase letters or digits.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseEdit"}}}}
      responses:
        '201': {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedPose"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
        '422': {"$ref": "#/components/responses/PoseRejected"}
  /poses/{id}:
    patch:
      tags: ["poses"]
      operationId: patchPose
      description: Same fields as create; id cannot change. Changing name, description or tags checks the wording again.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/PoseId"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseEdit"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedPose"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
        '422': {"$ref": "#/components/responses/PoseRejected"}
    delete:
      tags: ["poses"]
      operationId: removePose
      description: Becomes a REMOVED tombstone (the id is not reusable); deleting again also answers 204. Renders already prepared keep the pose text they froze.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/PoseId"}}
      responses:
        '204': {"description": "No Content"}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /poses/batch:
    post:
      tags: ["poses"]
      operationId: batchPoses
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseBatch"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"updated": {"type": "integer"}}, "required": ["updated"]}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
  /poses/extract:
    post:
      tags: ["poses"]
      operationId: extractPose
      description: Raw PNG or JPEG bytes (20 MiB HMAC body limit on this route). One vision call with the management-side switches; nothing is saved and the picture is neither stored nor logged. At most 100 per day, counted apart from user quotas (429 POSE_DAILY_LIMIT). Save the edited draft with POST /poses.
      requestBody: {"required": true, "content": {"image/png": {"schema": {"type": "string", "format": "binary"}}, "image/jpeg": {"schema": {"type": "string", "format": "binary"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"draft": {"$ref": "#/components/schemas/PoseDraft"}}, "required": ["draft"]}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '413': {"$ref": "#/components/responses/Problem"}
        '422': {"$ref": "#/components/responses/PoseRejected"}
        '429': {"$ref": "#/components/responses/Problem"}
        '502': {"$ref": "#/components/responses/Problem"}
  /poses/check:
    post:
      tags: ["poses"]
      operationId: checkPose
      description: Word-list preview of every kind, regardless of the switches. No model call.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseCheckRequest"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseCheckResult"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /poses/check-settings:
    get:
      tags: ["poses"]
      operationId: getPoseCheckSettings
      description: The user-side minor check starts from closet.ootd.pose-minor-check-enabled the first time it is read; afterwards this setting decides.
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseCheckSettings"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
    put:
      tags: ["poses"]
      operationId: putPoseCheckSettings
      description: Optimistic lock on revision (409 POSE_CHECK_REVISION_CONFLICT). Recorded as POSE_CHECK_SETTINGS with the six values before and after. Existing cards are never deleted.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseCheckSettingsChange"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseCheckSettings"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
  /poses/sensitive-terms:
    get:
      tags: ["poses"]
      operationId: listPoseSensitiveTerms
      description: The pose sensitivity word list. Not paged; at most 1000 items ordered by kind (SUGGESTIVE, NUDITY, MINOR) then by the folded word; total counts every match.
      parameters:
        - {"name": "kind", "in": "query", "schema": {"$ref": "#/components/schemas/PoseTermKind"}}
        - {"name": "enabled", "in": "query", "schema": {"type": "boolean"}}
        - {"name": "q", "in": "query", "description": "Folded word or reason contains (lower case, no whitespace, full-width folded)", "schema": {"type": "string"}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseSensitiveTermPage"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
    post:
      tags: ["poses"]
      operationId: createPoseSensitiveTerm
      description: Adds an enabled ADMIN word; it applies to the next check. The same folded word in the same kind answers 409 POSE_TERM_EXISTS; an empty or too long word or reason answers 400 POSE_TERM_INVALID; more than 1000 words answers 400 POSE_TERM_LIMIT. Recorded as POSE_TERM_CREATE.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseSensitiveTermCreate"}}}}
      responses:
        '201': {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseSensitiveTerm"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
  /poses/sensitive-terms/{id}:
    patch:
      tags: ["poses"]
      operationId: patchPoseSensitiveTerm
      description: Absent fields stay; source never changes. enabled=false stops matching at once, true brings it back. Recorded as POSE_TERM_EDIT.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseSensitiveTermEdit"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PoseSensitiveTerm"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
    delete:
      tags: ["poses"]
      operationId: deletePoseSensitiveTerm
      description: Deletes the row for good, SEED words included; it stops matching at once. An unknown id answers 404 POSE_TERM_NOT_FOUND. Recorded as POSE_TERM_DELETE.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      responses:
        '204': {"description": "No Content"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}

  /feedback:
    get:
      tags: ["feedback"]
      operationId: listFeedback
      description: Newest first. q searches content, reply and note (case-insensitive). counts follow every filter except status, for the status tabs. username and userKey are set only for ACCOUNT feedback.
      parameters:
        - {"name": "status", "in": "query", "schema": {"$ref": "#/components/schemas/FeedbackStatus"}}
        - {"name": "category", "in": "query", "schema": {"$ref": "#/components/schemas/FeedbackCategory"}}
        - {"name": "submitter", "in": "query", "schema": {"$ref": "#/components/schemas/FeedbackSubmitter"}}
        - {"name": "q", "in": "query", "schema": {"type": "string", "maxLength": 100}}
        - {"$ref": "#/components/parameters/From"}
        - {"$ref": "#/components/parameters/To"}
        - {"$ref": "#/components/parameters/Page"}
        - {"$ref": "#/components/parameters/Size"}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackPage"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
  /feedback/settings:
    get:
      tags: ["feedback"]
      operationId: getFeedbackSettings
      description: anonymousEnabled starts from closet.feedback.anonymous-enabled (defaultAnonymousEnabled) the first time it is read; afterwards this setting decides.
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackSettings"}}}}
        '401': {"$ref": "#/components/responses/Problem"}
    put:
      tags: ["feedback"]
      operationId: putFeedbackSettings
      description: Optimistic lock on revision (409 FEEDBACK_SETTINGS_CONFLICT). Turning anonymous feedback off makes signed-out submissions answer 403 FEEDBACK_ANONYMOUS_CLOSED at once. Recorded as FEEDBACK_SETTINGS with the value before and after.
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackSettingsChange"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackSettings"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
  /feedback/{id}:
    patch:
      tags: ["feedback"]
      operationId: patchFeedback
      description: Absent fields stay; an empty reply or note clears it. revision must match (409 FEEDBACK_REVISION_CONFLICT). Only ACCOUNT feedback takes a reply (409 FEEDBACK_REPLY_UNAVAILABLE); a new or changed reply sends the user one in-site notification. Recorded as FEEDBACK_EDIT with field names and the new status only.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FeedbackEdit"}}}}
      responses:
        '200': {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Feedback"}}}}
        '400': {"$ref": "#/components/responses/Problem"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}
        '409': {"$ref": "#/components/responses/Problem"}
    delete:
      tags: ["feedback"]
      operationId: deleteFeedback
      description: Deletes for good. An unknown id answers 404 FEEDBACK_NOT_FOUND. Recorded as FEEDBACK_DELETE with the submitter kind and status only.
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      responses:
        '204': {"description": "No Content"}
        '401': {"$ref": "#/components/responses/Problem"}
        '404': {"$ref": "#/components/responses/Problem"}

  /models:
    get:
      tags: [models]
      operationId: getModels
      description: 模型调配总览：服务商（密钥只给打码提示）、模型、三类能力的路由与健康状态、最近切换记录。部署配置来源的行 editable=false。
      responses:
        '200':
          description: 总览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelOverview' }
        '401': { $ref: '#/components/responses/Problem' }
  /models/usage:
    get:
      tags: [models]
      operationId: getModelUsage
      description: 模型调用与消耗：按服务商、模型、用途、每日汇总调用账本（model_call），含成功率、耗时、token、出图、费用快照、错误码排行与最近调用。日期按 Asia/Shanghai，含两端，默认最近 7 天，最长 92 天。账本不含用户、提示词、图片与回复内容。
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: capability, in: query, required: false, schema: { type: string, enum: [VISION, IMAGE, CHAT] } }
        - { name: providerId, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: model, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 160 } }
      responses:
        '200':
          description: 汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelUsage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /models/providers:
    post:
      tags: [models]
      operationId: createModelProvider
      description: 新增服务商。密钥只写不读，响应只含 apiKeyHint。未设置主密钥时 409 MODEL_KEY_NOT_CONFIGURED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelProviderInput' }
      responses:
        '201':
          description: 已创建的服务商（不含密钥）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProvider' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /models/providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,31}$' } }
    patch:
      tags: [models]
      operationId: updateModelProvider
      description: 改名称、地址、超时、图片域名，或传 apiKey 换密钥。revision 必填；部署配置服务商 409 MODEL_SOURCE_READ_ONLY，revision 不一致 409 MODEL_CONFLICT。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelProviderPatch' }
      responses:
        '200':
          description: 更新后的服务商
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProvider' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [models]
      operationId: deleteModelProvider
      description: 只能删数据库服务商且它下面没有模型（409 MODEL_PROVIDER_HAS_ENTRIES）；部署配置服务商 409 MODEL_SOURCE_READ_ONLY。
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /models/providers/{id}/probe:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,31}$' } }
    post:
      tags: [models]
      operationId: probeModelProvider
      description: 免费探测：调用服务商的列模型接口，不调用任何计费接口。
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProbeResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /models/entries:
    post:
      tags: [models]
      operationId: createModelEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelEntryInput' }
      responses:
        '201':
          description: 已创建的模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /models/entries/{id}:
    parameters:
      - { name: id, in: path, required: true, description: '模型 id，部署配置的形如 cfg:vision:yumg:gpt-6-luna（含冒号）', schema: { type: string, maxLength: 300 } }
    patch:
      tags: [models]
      operationId: updateModelEntry
      description: 改显示名、地址、参数、开关；模型名、能力、服务商、协议不可改。revision 必填。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelEntryPatch' }
      responses:
        '200':
          description: 更新后的模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [models]
      operationId: deleteModelEntry
      description: 只能删数据库模型，且它不是任何能力的生效或备用（409 MODEL_IN_USE）。
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /models/entries/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 300 } }
    post:
      tags: [models]
      operationId: resumeModelEntry
      description: 清除该模型的暂停状态。
      responses:
        '200':
          description: 模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelEntry' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /models/entries/{id}/references:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 300 } }
    put:
      tags: [models]
      operationId: setModelEntryReferences
      description: 生图模型的参考图设置：单次最多几张参考图，超出时把多出的拼成一张编号拼图（STITCH，默认）还是直接报错（REJECT）。部署配置的模型也可以改。maxReferenceImages 为 null 时用协议默认值（百炼 Qwen-Image 3、Gemini 14、OpenAI Images 16）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                maxReferenceImages: { type: [integer, 'null'], minimum: 1, maximum: 20 }
                overLimit: { type: [string, 'null'], enum: [STITCH, REJECT, null] }
                revision: { type: integer, format: int64, description: references.revision，没保存过为 0 }
      responses:
        '200':
          description: 模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /models/entries/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 300 } }
    post:
      tags: [models]
      operationId: testModelEntry
      description: 对该模型发一次最小真实请求（识图：64×64 纯色图；对话：一句“回复 ok”），会产生一次调用费用并计入全站模型预算。生图模型不提供（400 MODEL_INVALID）。
      responses:
        '200':
          description: 试用结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelTestResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /models/routing/{capability}:
    parameters:
      - { name: capability, in: path, required: true, schema: { type: string, enum: [VISION, IMAGE, CHAT] } }
    put:
      tags: [models]
      operationId: setModelRouting
      description: 设生效与备用。两者须同能力、已开启、服务商可用且互不相同。revision 可选，给了必须与当前一致。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelRoutingInput' }
      responses:
        '200':
          description: 该能力的路由
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouting' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [models]
      operationId: clearModelRouting
      description: 删除路由行，回到部署默认。
      responses:
        '200':
          description: 回到默认后的路由
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouting' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    closetHmac:
      type: apiKey
      in: header
      name: X-Closet-Signature
      description: |
        必填头：`X-Closet-Key-Id`、`X-Closet-Timestamp`（Unix 毫秒）、`X-Closet-Nonce`（16–64 位 `[A-Za-z0-9_-]`）、`X-Closet-Signature`。
        可选头：`X-Operator`（≤128 字符单行）、`X-Request-Id`（≤128 字符 `[A-Za-z0-9._:-]`），二者参与签名。

        签名 = base64url 无填充 (HMAC-SHA256(secret, canonical))，canonical 为以下各行用 `\n` 连接（末尾无换行）：
        ```
        CLOSET-HMAC-SHA256
        <METHOD 大写>
        <原始路径，不含 query，不解码>
        <规范化 query：按名再按值排序，RFC 3986 编码，name=value 以 & 连接；无则空串>
        <timestamp>
        <nonce>
        <X-Operator 或空串>
        <X-Request-Id 或空串>
        <body SHA-256 小写十六进制>
        ```
        时间偏差上限默认 300 秒；nonce 在 600 秒内不可重复。
  parameters:
    CreationTemplateId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,79}$', description: 'effect id; the built-in three keep their names, new ones are fx- plus 8 hex; unknown ids answer 404' }
    CreationVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' }
    ScopeUsername:
      name: username
      in: query
      description: 缺省为全站
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      description: 缺省为 to 往前 29 天；区间最长 366 天
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: 缺省为今天（Asia/Shanghai）
      schema: { type: string, format: date }
  responses:
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PoseRejected:
      description: 动作不适合试穿（code 为 POSE_REJECTED），hits 列出命中的词或识图拒收原因
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/PoseRejectedProblem' }
