        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        enabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAtMs: { type: integer, format: int64 }
        lastActiveAtMs: { type: [integer, 'null'], format: int64 }
        activeSessionCount: { type: integer }
        garments:
          type: object
          description: 键为实际出现的 closet_status
          additionalProperties: { type: integer }
        outfitCount: { type: integer }
        outfitPlanCount: { type: integer }
        quickIntakeCount: { type: integer }
        hasWearerProfile: { type: boolean }
        activePortableLinkCount: { type: integer }
        quota: { $ref: '#/components/schemas/Quota' }
        inviteId: { type: [string, 'null'], description: '注册时使用的邀请码 id' }
        loginLock: { $ref: '#/components/schemas/LoginLock' }
        displayName: { type: [string, 'null'], description: '昵称，未设置为 null' }
        registeredVia: { type: string, enum: [ADMIN, INVITE, OPEN], description: '账号来源' }
        lastLoginAtMs: { type: [integer, 'null'], format: int64, description: '最近一次密码登录或注册时间' }
        deactivatedAtMs: { type: [integer, 'null'], format: int64, description: '用户自助注销时间；重新启用后清空' }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username: { type: string, pattern: '^(?!.*\.\.)[A-Za-z0-9_.-]{2,80}$', description: '新用户名不能包含连续的点（如 `..`），否则无法作为路径段寻址；已有账号的查询仍按路径参数的旧规则匹配' }
        role: { $ref: '#/components/schemas/Role' }
        password: { $ref: '#/components/schemas/OptionalPassword' }
        displayName: { type: [string, 'null'], maxLength: 40, description: '昵称，可省略；首尾空白会去掉，空白视为未设置，最多 40 个字符（按 Unicode 字符计），不得含控制字符，否则返回 400 VALIDATION_FAILED' }
    CredentialResult:
      type: object
      required: [username, temporaryPassword]
      properties:
        username: { type: string }
        temporaryPassword:
          type: [string, 'null']
          description: 仅在未指定密码时返回一次，调用方不得记录
    Session:
      type: object
      required: [sessionRef, createdAtMs, lastAccessAtMs, expiresAtMs, portable]
      properties:
        sessionRef: { type: string, description: '不可逆引用，不能用于登录' }
        createdAtMs: { type: integer, format: int64 }
        lastAccessAtMs: { type: integer, format: int64 }
        expiresAtMs: { type: integer, format: int64 }
        portable: { type: boolean }
    LoginLock:
      type: object
      required: [locked, recentFailures, retryAfterSeconds]
      properties:
        locked: { type: boolean }
        recentFailures: { type: integer, description: '15 分钟内失败次数' }
        retryAfterSeconds: { type: integer, description: '锁定剩余秒数，未锁定为 0' }
    RegistrationState:
      type: object
      required: [mode, configuredMode, overridden, activeInviteCount]
      properties:
        mode: { type: string, enum: [CLOSED, INVITE, OPEN], description: '当前生效模式' }
        configuredMode: { type: string, enum: [CLOSED, INVITE, OPEN], description: '部署配置 CLOSET_REGISTRATION' }
        overridden: { type: boolean }
        updatedBy: { type: [string, 'null'] }
        updatedAtMs: { type: [integer, 'null'], format: int64 }
        activeInviteCount: { type: integer }
    AccountEvent:
      type: object
      required: [occurredAtMs, actor, action]
      properties:
        occurredAtMs: { type: integer, format: int64 }
        actor: { type: string, description: '操作者：用户名本人、鱼搭管理员用户名或 manage:{keyId}[:{X-Operator}]' }
        action:
          type: string
          description: REGISTERED、LOGIN_SUCCEEDED、LOGIN_FAILED / LOGIN_LOCKED / PASSWORD_CONFIRM_FAILED / PORTABLE_LOGIN_FAILED（username 为登录名的单向键 ~xxxxxxxxxxxxxxxx，不含口令、IP、UA）、ACCESS_DENIED / CSRF_REJECTED / MANAGE_AUTH_REJECTED（detail 为方法、路径模板、角色）、INVITE_CREATED / INVITE_REVOKED / INVITE_USED / INVITE_REJECTED（只含邀请码 id）、PASSWORD_CHANGED、PROFILE_UPDATED、SESSIONS_REVOKED、DEACTIVATED、ADMIN_*（鱼搭内管理员）、MANAGE_*（管理接口）、AGENT_COMMAND（助手触发的危险操作：批量或单件回收、修改个人资料、删除基准人物或 OOTD、记忆维护；detail 含 event、kind、命令 id、会话与请求 id，不含内容）
        detail: { type: [string, 'null'] }
    SecurityAuditIntegrity:
      type: object
      required: [status, sealedDays, verifiedDays, expiredDays, unsealedDays, problems]
      properties:
        status: { type: string, enum: [INTACT, TAMPERED, EMPTY] }
        sealedDays: { type: integer }
        verifiedDays: { type: integer, description: '保留期内、记录与摘要都已核对的天数' }
        expiredDays: { type: integer, description: '记录已按保留期清理、只核对摘要链的天数' }
        unsealedDays: { type: integer, description: '最后封存日之后、尚未封存的已结束日数' }
        latestDay: { type: [string, 'null'], format: date }
        latestDigest: { type: [string, 'null'] }
        problems:
          type: array
          maxItems: 50
          items:
            type: object
            required: [day, kind, message]
            properties:
              day: { type: string, format: date }
              kind: { type: string, enum: [ROWS_MODIFIED, CHAIN_BROKEN, DIGEST_ALTERED] }
              message: { type: string }
    SecurityAuditItem:
      type: object
      required: [id, occurredAtMs, category, source, type, subject, actor]
      properties:
        id: { type: string }
        occurredAtMs: { type: integer, format: int64 }
        category: { type: string, enum: [AUTH, ACCESS, ACCOUNT, INVITE, ASSISTANT, MANAGEMENT, MODEL] }
        source: { type: string, enum: [ACCOUNT_EVENT, MANAGEMENT_LOG, MODEL_USAGE, GENERATION_ATTEMPT] }
        type: { type: string }
        subject: { type: string, description: '事件所涉账号；登录失败为 ~ 加 16 位单向键；无账号时为 -' }
        actor: { type: string }
        result: { type: [string, 'null'], description: '管理操作 SUCCESS / FAILURE；模型调用 OK / UNKNOWN（令牌用量缺失）/ FAILED / CANCELLED，生成尝试为其状态' }
        detail: { type: [string, 'null'] }
    Invite:
      type: object
      required: [id, maxUses, usedCount, createdBy, createdAtMs, expiresAtMs, status]
      properties:
        id: { type: string }
