    put: {"summary": "\u66f4\u65b0\u7528\u6237\u8bd5\u7a7f\u7b56\u7565", "operationId": "tryonPutUsersUsernamePolicy", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "username", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TryOnUserPolicy"}}}}}
  /tryon/users/{username}/usage:
    get: {"summary": "\u67e5\u8be2\u7528\u6237\u8bd5\u7a7f\u7528\u91cf", "operationId": "tryonGetUsersUsernameUsage", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "username", "in": "path", "required": true, "schema": {"type": "string"}}]}
  /tryon/users/{username}/startup-failures/reset:
    post:
      summary: 解除指定用户的启动失败重试保护
      description: 只重置首帧前失败计数基准，不改历史费用、用户时长、预算、会话状态或全局开关；记录管理操作日志。
      operationId: tryonResetUserStartupFailures
      parameters:
        - {name: username, in: path, required: true, schema: {type: string, maxLength: 160}}
      responses:
        '200': {description: '重置时间与启动失败保护状态', content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /tryon/accounts:
    get: {"summary": "\u67e5\u8be2\u8fd0\u8425\u8d26\u6237", "operationId": "tryonGetAccounts", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}}
    post: {"summary": "\u767b\u8bb0\u8d26\u6237\u4e0e\u6c38\u4e45\u51ed\u8bc1", "operationId": "tryonPostAccounts", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TryOnCredentialInput"}}}}}
  /tryon/accounts/{id}:
    get: {"summary": "\u67e5\u8be2\u8d26\u6237\u6982\u51b5", "operationId": "tryonGetAccountsId", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]}
    patch: {"summary": "\u8c03\u6574\u8d26\u6237\u8c03\u5ea6", "operationId": "tryonPatchAccountsId", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TryOnAccountChange"}}}}}
  /tryon/accounts/{id}/credentials:
    post: {"summary": "\u8f6e\u6362\u540c\u8d26\u6237\u6c38\u4e45\u51ed\u8bc1", "operationId": "tryonPostAccountsIdCredentials", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TryOnCredentialInput"}}}}}
  /tryon/accounts/{id}/credentials/{credentialId}:
    delete: {"summary": "\u505c\u7528\u672a\u88ab\u5728\u9014\u5f15\u7528\u7684\u51ed\u8bc1", "operationId": "tryonDeleteAccountsIdCredentialsCredentialid", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"name": "credentialId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]}
  /tryon/accounts/{id}/probe:
    post: {"summary": "\u53ea\u8bfb\u63a2\u6d4b\u4f59\u989d\u4e0e\u6388\u6743", "operationId": "tryonPostAccountsIdProbe", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]}
  /tryon/accounts/{id}/budget:
    post: {"summary": "\u66f4\u65b0\u672c\u5730\u7d2f\u8ba1\u652f\u51fa\u6388\u6743", "operationId": "tryonPostAccountsIdBudget", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TryOnBudgetChange"}}}}}
  /tryon/pool:
    get: {"summary": "\u67e5\u8be2\u603b\u6c60\u53ef\u7528\u6c60\u548c\u5e76\u53d1", "operationId": "tryonGetPool", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}}
  /tryon/reference-source:
    get: {"summary": "\u67e5\u8be2\u8bd5\u7a7f\u53c2\u8003\u56fe\u6765\u6e90\uff08\u8bd5\u7a7f\u4e13\u7528\u5b58\u50a8\u6876\u3001\u672c\u7ad9\u516c\u7f51\u7ad9\u70b9\u6216\u4ec5\u9650\u672c\u5730\u5f00\u53d1\u7684 XMax \u5b58\u50a8\uff09\u4e0e\u5404\u72b6\u6001\u53c2\u8003\u56fe\u8bb0\u5f55\u6570", "operationId": "tryonGetReferenceSource", "responses": {"200": {"description": "\u6765\u6e90\u3001devOnly\u3001\u6876\u4e3b\u673a\u540d/\u6876\u540d/\u524d\u7f00\u6216\u7ad9\u70b9 origin\u3001\u5730\u5740\u6709\u6548\u671f\u4e0e\u8bb0\u5f55\u8ba1\u6570\uff1b\u4e0d\u542b\u8bbf\u95ee\u5bc6\u94a5\u3001\u4ee4\u724c\u6216\u56fe\u7247\u5730\u5740", "content": {"application/json": {"schema": {}}}}}}
  /tryon/usage:
    get: {"summary": "\u67e5\u8be2\u8bd5\u7a7f\u6210\u672c\u6c47\u603b", "operationId": "tryonGetUsage", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}}
  /tryon/sessions:
    get: {"summary": "\u67e5\u8be2\u4f1a\u8bdd\u4e0e\u5f85\u56de\u6536\u8bb0\u5f55", "operationId": "tryonGetSessions", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}}
  /tryon/sessions/{id}:
    get: {"summary": "\u67e5\u8be2\u5355\u6b21\u4f1a\u8bdd", "operationId": "tryonGetSessionsId", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]}
  /tryon/sessions/{id}/stop:
    post: {"summary": "\u7d27\u6025\u505c\u6b62\u5355\u6b21\u4f1a\u8bdd", "operationId": "tryonPostSessionsIdStop", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]}
  /tryon/accounts/{id}/stop-sessions:
    post: {"summary": "\u7d27\u6025\u505c\u6b62\u8d26\u6237\u5728\u9014\u4f1a\u8bdd", "operationId": "tryonPostAccountsIdStopSessions", "responses": {"200": {"description": "\u64cd\u4f5c\u7ed3\u679c\uff1b\u4e0d\u542b\u6c38\u4e45\u5bc6\u94a5\u4e0e\u79c1\u4eba\u5a92\u4f53\u5185\u5bb9", "content": {"application/json": {"schema": {}}}}}, "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]}
  /billing/settings:
    get:
      tags: [billing]
      operationId: getBillingSettings
      description: 生效值 = 管理覆盖值（若有）否则部署配置（`CLOSET_BILLING_*`）。总开关关闭时所有路径回到收费前的行为，余额与权益不受影响。
      responses:
        '200': { description: '开关状态', content: { application/json: { schema: { $ref: '#/components/schemas/BillingSettingsView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      tags: [billing]
      operationId: setBillingSettings
      description: 完整替换全部覆盖；字段为 null 或缺省则该开关回到部署配置，全部缺省即恢复默认。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: [boolean, 'null'] }
                tryonEnabled: { type: [boolean, 'null'] }
                imageEnabled: { type: [boolean, 'null'] }
                agentEnabled: { type: [boolean, 'null'] }
                showPrices: { type: [boolean, 'null'] }
      responses:
        '200': { description: '修改后的状态', content: { application/json: { schema: { $ref: '#/components/schemas/BillingSettingsView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/tiers:
    get:
      tags: [billing]
      operationId: listBillingTiers
      description: 能力档位、当前映射模型与当前点数单价（千分点/单位；无价格表示该档位不按点数收费）。
      responses:
        '200': { description: '档位', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BillingTier' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/tiers/{tier}:
    parameters: [ { name: tier, in: path, required: true, schema: { type: string, pattern: '^[a-z]+\.[a-z]+$' } } ]
    put:
      tags: [billing]
      operationId: changeBillingTier
      description: 追加模型和/或点数价格的新版本，自 `effectiveFromMs`（默认现在）起生效；历史消费保留当时的版本。至少提供 model、milliPointsPerUnit 之一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model: { type: string, minLength: 1, maxLength: 80 }
                milliPointsPerUnit: { type: integer, minimum: 0, maximum: 1000000000 }
                effectiveFromMs: { type: integer }
      responses:
        '200': { description: '修改后的档位', content: { application/json: { schema: { $ref: '#/components/schemas/BillingTier' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /billing/cost-rates:
    get:
      tags: [billing]
      operationId: listBillingCostRates
      parameters:
        - { name: model, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: '成本版本，新的在前', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BillingCostRate' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [billing]
      operationId: addBillingCostRate
      description: 追加一个上游成本版本，不覆盖旧版本。金额为币种的百万分之一（5600 = 0.0056 元）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, unit, amountMicro, currency]
              properties:
                model: { type: string, minLength: 1, maxLength: 80 }
                unit: { type: string, enum: [PER_IMAGE, PER_MTOK_IN, PER_MTOK_OUT, PER_SECOND] }
                amountMicro: { type: integer, minimum: 0 }
                currency: { type: string, minLength: 1, maxLength: 8 }
                effectiveFromMs: { type: integer }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { description: '已追加', content: { application/json: { schema: { $ref: '#/components/schemas/BillingCostRate' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/margin:
    get:
      tags: [billing]
      operationId: getBillingMargin
      description: 按档位 × 天（Asia/Shanghai）× 币种的收入、成本、免费用量成本、失败成本、利润与毛利率，及未消耗点数负债。口径见设计文档第 13 节。币种不同的行不给利润。
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: '利润报表', content: { application/json: { schema: { $ref: '#/components/schemas/BillingMarginReport' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/margin/alerts:
    get:
      tags: [billing]
      operationId: listBillingMarginAlerts
      description: 各档位点数价格相对上游成本的告警（NO_PRICE、NO_COST、BELOW_COST、LOW_MARGIN、OK）。只告警，不改价。
      responses:
        '200': { description: '告警', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BillingAlert' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/margin/explain:
    get:
      tags: [billing]
      operationId: explainBillingMargin
      description: 列出范围内每次用量及其使用的成本版本，保证报表里每个数都能复算。用户只以 userKey 出现。
      parameters:
        - { name: tier, in: query, required: true, schema: { type: string, pattern: '^[a-z]+\.[a-z]+$' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: '用量明细', content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/products:
    get:
      tags: [billing]
      operationId: listBillingProducts
      description: '全部商品（含已下架），金额为币种最小单位（分、cent），各币种分开。'
      responses:
        '200': { description: '商品', content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [billing]
      operationId: createBillingProduct
      description: '新建商品：POINTS（点数包）只含点数，SUBSCRIPTION（订阅）只含权益天数与额度，二选一不混。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, name, currency, priceMinor]
              properties:
                kind: { type: string, enum: [POINTS, SUBSCRIPTION] }
                name: { type: string, minLength: 1, maxLength: 120 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                priceMinor: { type: integer, minimum: 1, maximum: 100000000 }
                points: { type: integer, minimum: 0, maximum: 10000000 }
                entDays: { type: integer, minimum: 1, maximum: 3650 }
                entImageDailyLimit: { type: integer, minimum: 0, maximum: 1000 }
                entAgentDailyLimit: { type: integer, minimum: 0, maximum: 1000 }
                enabled: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '201': { description: '已创建', content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/products/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 36 } } ]
    put:
      tags: [billing]
      operationId: updateBillingProduct
      description: '只能改名称、价格、上下架与排序；商品发放的内容不可改，已下的订单保持下单时的条款。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                priceMinor: { type: integer, minimum: 1, maximum: 100000000 }
                enabled: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '200': { description: '更新后的商品', content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /billing/orders:
    get:
      tags: [billing]
      operationId: listBillingOrders
      description: '订单，新的在前；用户只以 userKey 出现。'
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [CREATED, PAID, FULFILLED, CLOSED, FAILED, DISPUTED] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: '订单', content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /billing/orders/{id}/sandbox-dispute:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 36 } } ]
    post:
      tags: [billing]
      operationId: sandboxDisputeOrder
      description: '只对沙箱渠道订单演练拒付（撤销发放、冲回点数）；真实渠道的拒付由渠道通知，这里不提供远程退款。'
      responses:
        '200': { description: '处理后的订单', content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /billing/redemption-batches:
    get:
      tags: [billing]
      operationId: listRedemptionBatches
      responses:
        '200': { description: '批次，新的在前', content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [billing]
      operationId: createRedemptionBatch
      description: 创建兑换码批次。明文码只在此响应出现一次，库里只存 HMAC；未配置 `CLOSET_BILLING_REDEEM_HMAC_KEY` 时返回 503 REDEEM_NOT_CONFIGURED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, points, quantity]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                points: { type: integer, minimum: 0, maximum: 10000000 }
                unitPriceMicro: { type: integer, minimum: 0, description: '每点售价（币种百万分之一），0 表示赠送无收入；大于 0 必须填 currency' }
                currency: { type: string, maxLength: 8 }
                imageDailyLimit: { type: integer, minimum: 0, maximum: 1000 }
                agentDailyLimit: { type: integer, minimum: 0, maximum: 1000 }
                entitlementDays: { type: integer, minimum: 1, maximum: 3650 }
                quantity: { type: integer, minimum: 1, maximum: 500 }
                validFromMs: { type: integer }
                validUntilMs: { type: integer }
      responses:
        '201': { description: '已创建（含一次性明文码）', content: { application/json: { schema: { type: object, required: [batch, codes], properties: { batch: { type: object }, codes: { type: array, items: { type: string } } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /billing/redemption-batches/{id}/codes:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 36 } } ]
    get:
      tags: [billing]
      operationId: listRedemptionCodes
      description: 只返回遮罩码、状态与兑换人 userKey，明文码无法找回。
      responses:
        '200': { description: '码', content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /billing/redemption-batches/{id}/disable:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 36 } } ]
    post:
      tags: [billing]
      operationId: disableRedemptionBatch
      description: 停用批次内所有未兑换的码；已兑换的点数与权益不动。
      responses:
        '200': { description: '停用后的批次', content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /billing/entitlements/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 36 } } ]
    delete:
      tags: [billing]
      operationId: revokeEntitlement
      description: 立即结束一个权益，记录保留。重复撤销保留第一次时间。
      responses:
        '200': { description: '撤销后的权益', content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/billing:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [billing]
      operationId: getUserBilling
      description: 该用户的点数余额、预留、全部权益与最近 50 条流水。
      responses:
        '200': { description: '用户收费概览', content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/points:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    post:
      tags: [billing]
      operationId: changeUserPoints
      description: 正数为赠送（无收入），负数为更正。相同 `Idempotency-Key` 不会重复生效。
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [points]
              properties:
                points: { type: integer, description: '非 0，绝对值不超过 10000000' }
                note: { type: string, maxLength: 200 }
      responses:
        '200': { description: '写入的流水', content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/entitlements:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    post:
      tags: [billing]
      operationId: grantUserEntitlement
      description: 发放一个自现在起 `days` 天的权益（只抬高额度），至少设置一项额度。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days]
              properties:
                imageDailyLimit: { type: integer, minimum: 0, maximum: 1000 }
                agentDailyLimit: { type: integer, minimum: 0, maximum: 1000 }
                days: { type: integer, minimum: 1, maximum: 3650 }
                note: { type: string, maxLength: 80 }
      responses:
        '201': { description: '已发放', content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    closetHmac:
      type: apiKey
      in: header
      name: X-Closet-Signature
      description: |
        必填头：`X-Closet-Key-Id`、`X-Closet-Timestamp`（Unix 毫秒）、`X-Closet-Nonce`（16–64 位 `[A-Za-z0-9_-]`）、`X-Closet-Signature`。
        可选头：`X-Operator`（≤128 字符单行）、`X-Request-Id`（≤128 字符 `[A-Za-z0-9._:-]`），二者参与签名。

        签名 = base64url 无填充 (HMAC-SHA256(secret, canonical))，canonical 为以下各行用 `\n` 连接（末尾无换行）：
        ```
        CLOSET-HMAC-SHA256
        <METHOD 大写>
        <原始路径，不含 query，不解码>
        <规范化 query：按名再按值排序，RFC 3986 编码，name=value 以 & 连接；无则空串>
        <timestamp>
        <nonce>
        <X-Operator 或空串>
        <X-Request-Id 或空串>
        <body SHA-256 小写十六进制>
        ```
        时间偏差上限默认 300 秒；nonce 在 600 秒内不可重复。
