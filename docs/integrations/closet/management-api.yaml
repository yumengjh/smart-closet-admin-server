          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleTermReviewResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /style-terms/pending/reject:
    post:
      tags: [style-terms]
      operationId: rejectStyleTerm
      description: 驳回该词在该映射下的全部待审核提案：不进全站词表，对提出者本人也不再生效。记操作日志 STYLE_TERM_REJECT。
