          items:
            type: object
            additionalProperties: true
            properties:
              billing: { $ref: '#/components/schemas/BillingDailyAggregate' }
    EventType:
      type: string
      enum: [garment_created, model_usage, outfit_created, quick_intake, recommendation_feedback, recommendation_shown, user_created, wear_logged, billing_order, billing_ledger]
    EventPage:
      type: object
      required: [items, nextCursor, hasMore, watermarkMs]
      properties:
        items:
          type: array
          items:
            type: object
            required: [type, id, atMs, userKey, attrs]
            properties:
              type: { $ref: '#/components/schemas/EventType' }
              id: { type: string }
              atMs: { type: integer }
              userKey: { type: string, description: 'HMAC-SHA256(盐, 用户名) 前 16 位十六进制；换盐即变' }
              attrs:
                type: object
                description: 'billing_order 仅含 orderId、status；billing_ledger 仅含 kind、points（带符号的余额变动），不含备注、actor、引用、渠道单号或商品名称'
                additionalProperties: true
        nextCursor: { type: string }
        hasMore: { type: boolean }
        watermarkMs: { type: integer }
    Template:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        source: { type: string, enum: [FILE, SAMPLE] }
        reviewStatus: { type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED] }
        enabled: { type: boolean }
        active: { type: boolean }
        bonus: { type: number }
        defaultBonus: { type: number }
        reviewedBy: { type: [string, 'null'] }
        reviewedAtMs: { type: integer }
        kind: { type: string, enum: [CLASSIC, TREND] }
        audience: { type: array, items: { type: string } }
        seasons: { type: array, items: { type: string } }
        occasions: { type: array, items: { type: string } }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        reference: { type: string }
        slots: { type: array, items: { type: object } }
    PendingStyleTerm:
      type: object
      required: [term, styles, hits, proposers, legacy, firstProposedAtMs, lastProposedAtMs, sharedStyles]
      properties:
        term: { type: string, description: '归一化后的风格词' }
        styles: { type: array, items: { type: string }, maxItems: 2, description: '助手给出的映射（标准风格）' }
        hits: { type: integer, description: '提出次数合计' }
        proposers: { type: integer, description: '提出该映射的不同用户数（不含迁移遗留条目）' }
        legacy: { type: boolean, description: '含迁移前无归属的遗留条目' }
        firstProposedAtMs: { type: integer, format: int64 }
        lastProposedAtMs: { type: integer, format: int64 }
        sharedStyles: { type: [array, 'null'], items: { type: string }, description: '全站词表里该词已有的映射；批准会替换它' }
    PendingStyleTermPage:
      type: object
      required: [items, total, page, size, vocabulary]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PendingStyleTerm' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        vocabulary: { type: array, items: { type: string }, description: '标准风格表' }
    StyleTermApprove:
      type: object
      additionalProperties: false
      required: [term, proposedStyles]
      properties:
        term: { type: string, minLength: 1, maxLength: 40 }
        proposedStyles: { type: array, minItems: 1, maxItems: 2, items: { type: string, maxLength: 20 }, description: '列表里该项的映射，用来定位提案' }
        styles: { type: array, maxItems: 2, items: { type: string, maxLength: 20 }, description: '修正后的映射（须在标准风格内）；缺省沿用 proposedStyles' }
    StyleTermReject:
      type: object
      additionalProperties: false
      required: [term, proposedStyles]
      properties:
        term: { type: string, minLength: 1, maxLength: 40 }
        proposedStyles: { type: array, minItems: 1, maxItems: 2, items: { type: string, maxLength: 20 } }
    StyleTermReviewResult:
      type: object
      required: [term, approved, styles]
      properties:
        term: { type: string }
        approved: { type: boolean }
        styles: { type: array, items: { type: string } }
    TemplateList:
      type: object
      required: [version, maxBonus, active, items]
      properties:
        version: { type: string }
        maxBonus: { type: number }
        active: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Template' } }

