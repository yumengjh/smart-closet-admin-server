  /exports/events:
    get:
      tags: [exports]
      operationId: exportEvents
      description: |
        去标识明细事件，按 (atMs, type, id) 排序，用 nextCursor 增量拉取；同一游标重复拉取结果一致。
        billing_order 从持久状态时间戳导出 CREATED、PAID、FULFILLED、CLOSED、DISPUTED，FAILED 从 AMOUNT_MISMATCH 支付事件导出；id 为 orderId:status，首次接入可补拉历史。billing_ledger 为只追加点数流水。
        只返回 watermarkMs（当前时间−5 秒）之前的事件。用户只以 userKey（HMAC-SHA256(盐, 用户名) 前 16 位）出现。
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - { name: since, in: query, description: '起始毫秒时间戳（含），与 cursor 二选一', schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
        - name: types
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
      responses:
        '200':
          description: 一页事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
