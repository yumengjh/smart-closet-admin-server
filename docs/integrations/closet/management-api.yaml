                bonus: { type: number, minimum: 0, maximum: 5 }
      responses:
        '200':
          description: 审核后的模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /samples:
    get:
      tags: [samples]
      operationId: listSamples
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, EXTRACTED, FAILED, APPROVED, REJECTED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: 样本列表（新的在前）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Sample' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [samples]
      operationId: uploadSample
      description: |
        上传整套穿搭样本并立即提取一次（调用识图模型）。图片只保留重新编码后的副本，重复图片返回 409；疑似未成年等情形自动拒收并立即删除原图。
        写操作记管理操作日志，操作人记为 manage:{keyId}:{X-Operator}；日志不含图片与提取正文。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'JPEG 或 PNG，最大 10 MB' }
                sourceUrl: { type: string, maxLength: 1000, description: 'http(s) 来源链接' }
                license: { type: string, enum: [OWN, PERMITTED, OPEN, RESEARCH, UNKNOWN], description: '默认 UNKNOWN' }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: 已创建的样本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sample' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
