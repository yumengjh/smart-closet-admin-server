# Started by hand (promotion "Link Fish Closet"): turn on the Fish Closet management API and connect this service to it.
version: v1.0
name: Link Fish Closet
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 15

blocks:
  - name: Link on server
    task:
      secrets:
        - name: deploy
      jobs:
        - name: link
          commands:
            - checkout
            - bash scripts/ci/link-closet.sh
