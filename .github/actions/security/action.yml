name: Security scans
description: Enforced history secrets, SAST and resolved Maven dependency checks
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Install scanners
      shell: bash
      run: |
        bash scripts/ci/install-security-tools.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Verify scan failure handling
      shell: bash
      run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci/tests
    - name: Run enforced scans
      shell: bash
      run: |
        mkdir -p security-reports
        git rev-parse HEAD > security-reports/commit.txt
        bash scripts/ci/security-scan.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: security-reports-${{ github.job }}
        path: security-reports
        retention-days: 30
