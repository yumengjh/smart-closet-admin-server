spring:
  application:
    name: spring-boot-starter-template
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  shutdown: graceful
  forward-headers-strategy: none

app:
  storage:
    local:
      root: ${APP_STORAGE_LOCAL_ROOT:${APP_DATA_DIR:./data}/storage}
  avatar:
    generator:
      base-url: ${APP_AVATAR_GENERATOR_BASE_URL:http://localhost:3100}
      connect-timeout: ${APP_AVATAR_GENERATOR_CONNECT_TIMEOUT:500ms}
      read-timeout: ${APP_AVATAR_GENERATOR_READ_TIMEOUT:1500ms}
      max-response-bytes: ${APP_AVATAR_GENERATOR_MAX_RESPONSE_BYTES:262144}
  integrations:
    closet:
      enabled: ${APP_CLOSET_ENABLED:false}
      base-url: ${APP_CLOSET_BASE_URL:http://127.0.0.1:8080}
      key-id: ${APP_CLOSET_KEY_ID:primary}
      secret: ${APP_CLOSET_SECRET:}
      connect-timeout: ${APP_CLOSET_CONNECT_TIMEOUT:2s}
      read-timeout: ${APP_CLOSET_READ_TIMEOUT:10s}
  response:
    powered-by: ${APP_RESPONSE_POWERED_BY:ASP.NET}
    server: ${APP_RESPONSE_SERVER:Microsoft-IIS/10.0}
  auth:
    refresh-cookie-secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
  security:
    trusted-proxies: ${APP_SECURITY_TRUSTED_PROXIES:}
    cors-allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
